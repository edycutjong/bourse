name: ✨ Feature Request
description: Suggest an idea or enhancement for Bourse
title: "feat: <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
      placeholder: As a buyer agent, I want ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Divergence engine
        - Backtest / optimizer
        - CMC MCP ingestion
        - ERC-8183 provider / commerce
        - CLI / scripts
        - Docs / DX
        - Other
    validations:
      required: true
